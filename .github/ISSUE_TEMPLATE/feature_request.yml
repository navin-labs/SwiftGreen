name: Feature request
description: Something SwiftGreen should do and doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would solve it
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: Works without a cloud service or account (SwiftGreen is local-only by design)
          required: true
